name: App Tester - Web
# Web check: Playwright Chromium + Firefox + WebKit (Safari engine) with phone, tablet and desktop profiles.
# Environment type: "Desktop emulation" (real browser engines, emulated phone screens). Real devices are not used.
# Free for public repositories (standard runners).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_report:
        description: 'Set to yes when a parent workflow builds the combined report'
        type: string
        default: 'no'

permissions:
  contents: read

jobs:
  web:
    name: web-${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app-tester/requirements-web.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.63.0-${{ runner.os }}-${{ matrix.engine }}
      - name: Install Playwright
        run: |
          pip install -r app-tester/requirements-web.txt
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Self-test of the checks
        run: python app-tester/selftest.py ${{ matrix.engine }}
      - name: Web check
        run: |
          python app-tester/web/run_web.py --engine ${{ matrix.engine }} --out qa-out/web-${{ matrix.engine }} \
            || { rc=$?; mkdir -p qa-out/web-${{ matrix.engine }}; echo "$rc" > qa-out/web-${{ matrix.engine }}/infra-exit.txt; }
      - name: Report (job summary)
        if: always()
        run: python app-tester/report/make_report.py --in qa-out --out qa-report-job --title "Web check - ${{ matrix.engine }}" > /dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-tester-env-web-${{ matrix.engine }}
          path: qa-out/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: web
    if: ${{ always() && inputs.skip_report != 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-tester-env-web-*
          path: qa-in
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the report
        id: build
        env:
          APP_TESTER_RUN_STARTED: ${{ github.run_started_at }}
        run: |
          set +e
          python app-tester/report/build_results.py --in qa-in --out app-tester-results --expect web-chromium,web-firefox,web-webkit --gate
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-tester-results
          path: app-tester-results/
          retention-days: 14
      - name: Gate (red when a check failed)
        if: ${{ steps.build.outputs.rc != '0' }}
        run: |
          echo "At least one check failed or no results were found. See the job summary and the app-tester-results artifact."
          exit 1
