name: qa-web
# Web QA: Playwright Chromium + Firefox + WebKit, tum cihaz profilleri, iki pilot uygulama.
# Ortam turu: "Masaustu taklidi" (gercek tarayici motoru, taklit edilmis mobil gorunum). Gercek cihaz testi YOKTUR.
# Herkese acik depoda standart runner ucretsizdir.
on:
  push:
    paths:
      - 'habit-tracker-2027/**'
      - 'daily-budget-planner/**'
      - 'qa/apps.json'
      - 'qa/profiles.json'
      - 'qa/lib/**'
      - 'qa/report/**'
      - 'qa/web/**'
      - 'qa/requirements-web.txt'
      - 'qa/selftest.py'
      - 'qa/fixtures/**'
      - '.github/workflows/qa-web.yml'
  pull_request:
    paths:
      - 'habit-tracker-2027/**'
      - 'daily-budget-planner/**'
      - 'qa/apps.json'
      - 'qa/profiles.json'
      - 'qa/lib/**'
      - 'qa/report/**'
      - 'qa/web/**'
      - 'qa/requirements-web.txt'
      - 'qa/selftest.py'
      - 'qa/fixtures/**'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Uygulama kimlikleri (virgullu, bos=hepsi): habit,budget'
        default: ''
      app_ref:
        description: 'Uygulama klasorlerini bu commit/etiketten al (bos=bu commit). Ornek: 19ff9a6'
        default: ''
      istek:
        description: 'qa/telefon-test.sh bu kimlikle kosuyu bulur (elle kosuda bos birakin)'
        default: ''

run-name: qa-web ${{ github.event.inputs.istek || github.event_name }}

permissions:
  contents: read

# Yalniz AYNI workflow'un ESKI push/PR kosusu iptal edilir (eski commit'in sonucu degersiz).
# Elle/telefon-test.sh ile tetiklenen kosular (workflow_dispatch) benzersiz grupta: hicbir push onu iptal etmez.
concurrency:
  group: qa-web-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  web:
    name: web-${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Uygulama surumunu sec (isteğe bağlı)
        if: ${{ github.event.inputs.app_ref != '' }}
        run: git checkout "${{ github.event.inputs.app_ref }}" -- habit-tracker-2027 daily-budget-planner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qa/requirements-web.txt
      - name: Playwright tarayici onbellegi
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.63.0-${{ runner.os }}-${{ matrix.engine }}
      - name: Playwright kur
        run: |
          pip install -r qa/requirements-web.txt
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Denetimlerin kendi testi
        run: python qa/selftest.py ${{ matrix.engine }}
      - name: Web QA
        run: python qa/web/run_web.py --engine ${{ matrix.engine }} --apps "${{ github.event.inputs.apps }}" --out qa-out/web-${{ matrix.engine }}
      - name: Rapor (artifact'siz, log'a tam metin)
        if: always()
        run: python qa/report/make_report.py --in qa-out --out qa-rapor-job --title "web-${{ matrix.engine }}" > /dev/null ; cat qa-rapor-job/mobil-uyumluluk-raporu.md 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-web-${{ matrix.engine }}
          path: qa-out/
          retention-days: 14

  rapor:
    needs: web
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-web-*
          path: qa-in
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rapor uret (GEÇTİ/KALDI tablosu job özetine yazılır)
        run: |
          python qa/report/make_report.py --in qa-in --out qa-rapor --title "Web QA raporu (Playwright)" > /dev/null
          cat qa-rapor/mobil-uyumluluk-raporu.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-web-rapor
          path: |
            qa-rapor/
            qa-in/
          retention-days: 14
      - name: Kapı (KALDI varsa kırmızı)
        run: python qa/report/make_report.py --in qa-in --out qa-rapor --gate --summary /dev/null > /dev/null
