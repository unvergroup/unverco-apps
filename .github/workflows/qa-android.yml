name: qa-android
# Android QA: Android emulatoru (KVM) + Chrome. Ortam turu "Emulator". Gercek cihaz testi YOKTUR.
# Standart ubuntu-latest runner (herkese acik depoda ucretsiz); larger runner KULLANILMAZ.
on:
  push:
    paths:
      - 'habit-tracker-2027/**'
      - 'daily-budget-planner/**'
      - 'qa/apps.json'
      - 'qa/profiles.json'
      - 'qa/lib/**'
      - 'qa/report/**'
      - 'qa/android/**'
      - 'qa/requirements-android.txt'
      - '.github/workflows/qa-android.yml'
  pull_request:
    paths:
      - 'habit-tracker-2027/**'
      - 'daily-budget-planner/**'
      - 'qa/apps.json'
      - 'qa/profiles.json'
      - 'qa/lib/**'
      - 'qa/report/**'
      - 'qa/android/**'
      - 'qa/requirements-android.txt'
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Uygulama klasorlerini bu commit/etiketten al (bos=bu commit). Android 9 hatasini yakalama kaniti: 19ff9a6 (1.0.2)'
        default: ''
      istek:
        description: 'qa/telefon-test.sh bu kimlikle kosuyu bulur (elle kosuda bos birakin)'
        default: ''

run-name: qa-android ${{ github.event.inputs.istek || github.event_name }}

permissions:
  contents: read

# Yalniz AYNI workflow'un ESKI push/PR kosusu iptal edilir; workflow_dispatch kosulari benzersiz grupta, iptal edilmez.
concurrency:
  group: qa-android-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  android:
    name: android-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Uygulama surumunu sec
        if: ${{ github.event.inputs.app_ref != '' }}
        run: git checkout "${{ github.event.inputs.app_ref }}" -- habit-tracker-2027 daily-budget-planner
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: qa/requirements-android.txt }
      - run: pip install -r qa/requirements-android.txt
      - name: KVM etkinlestir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # AVD/snapshot onbellegi DENENDI ve KAPATILDI: snapshot'tan acilista 3 kosunun 2'sinde "device offline" / exit 137 ile
      # emulator-script.sh hic kosmadi (calisma 46039994731 ve 46044310690); kazanc ~1 dk idi. Guvenilirlik > hiz: soguk acilis.
      - name: Android emulatoru + Chrome (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash qa/android/emulator-script.sh ${{ matrix.api }}
      - name: Rapor (artifact'siz, log'a tam metin)
        if: always()
        run: python qa/report/make_report.py --in qa-out --out qa-rapor-job --title "android-api${{ matrix.api }}" > /dev/null ; cat qa-rapor-job/mobil-uyumluluk-raporu.md 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-android-api${{ matrix.api }}
          path: qa-out/
          retention-days: 14

  rapor:
    needs: android
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: qa-android-api*, path: qa-in }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rapor (GEÇTİ/KALDI tablosu job özetine yazılır)
        run: |
          python qa/report/make_report.py --in qa-in --out qa-rapor --title "Android QA raporu" > /dev/null
          cat qa-rapor/mobil-uyumluluk-raporu.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-android-rapor
          path: |
            qa-rapor/
            qa-in/
          retention-days: 14
      - name: Kapı
        run: python qa/report/make_report.py --in qa-in --out qa-rapor --gate --summary /dev/null > /dev/null
