name: qa-ios
# iOS QA (macos-latest, standart runner; herkese acik depoda ucretsiz).
#  (a) Playwright WebKit + iPhone profilleri  -> ortam turu "Masaustu taklidi"
#  (b) Gercek iOS Simulatoru + Mobile Safari  -> ortam turu "Gercek motor/simulator"
# Gercek cihaz testi YOKTUR.
on:
  push:
    paths:
      - 'habit-tracker-2027/**'
      - 'daily-budget-planner/**'
      - 'qa/apps.json'
      - 'qa/profiles.json'
      - 'qa/lib/**'
      - 'qa/report/**'
      - 'qa/ios/**'
      - 'qa/requirements-web.txt'
      - '.github/workflows/qa-ios.yml'
  pull_request:
    paths:
      - 'habit-tracker-2027/**'
      - 'daily-budget-planner/**'
      - 'qa/apps.json'
      - 'qa/profiles.json'
      - 'qa/lib/**'
      - 'qa/report/**'
      - 'qa/ios/**'
      - 'qa/requirements-web.txt'
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Uygulama klasorlerini bu commit/etiketten al (bos=bu commit)'
        default: ''
      macos_runner:
        description: 'macOS runner etiketi: macos-15 (arm64, hizli; macos-latest/26 ve macos-14 kuyrukta/emekli)'
        default: 'macos-15'
      istek:
        description: 'qa/telefon-test.sh bu kimlikle kosuyu bulur (elle kosuda bos birakin)'
        default: ''

run-name: qa-ios ${{ github.event.inputs.istek || github.event_name }}

permissions:
  contents: read

# Yalniz AYNI workflow'un ESKI push/PR kosusu iptal edilir; workflow_dispatch kosulari benzersiz grupta, iptal edilmez.
# macOS kuyrugu kisitli oldugundan push kosusu yigilmasin diye eski push kosusunu iptal etmek ozellikle onemli.
concurrency:
  group: qa-ios-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  simulator:
    runs-on: ${{ github.event.inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Uygulama surumunu sec
        if: ${{ github.event.inputs.app_ref != '' }}
        run: git checkout "${{ github.event.inputs.app_ref }}" -- habit-tracker-2027 daily-budget-planner
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install Appium-Python-Client selenium pillow
      - name: Ortam bilgisi
        id: ver
        run: |
          sw_vers; xcodebuild -version; xcrun simctl list runtimes
          echo "k=$(xcodebuild -version | tr -d '\n ' )-appium2" >> "$GITHUB_OUTPUT"
      - name: Appium + XCUITest surucusu
        run: |
          npm install -g appium
          appium driver install xcuitest
          appium driver list --installed
      - name: WebDriverAgent onbellegi (derleme ciktisi)
        uses: actions/cache/restore@v4
        with:
          path: ~/wda-derived
          key: wda-${{ runner.os }}-${{ runner.arch }}-${{ steps.ver.outputs.k }}-yok
          restore-keys: wda-${{ runner.os }}-${{ runner.arch }}-${{ steps.ver.outputs.k }}-
      - name: iOS Simulatoru + Mobile Safari (Appium)
        id: appium
        continue-on-error: true
        run: python qa/ios/appium_run.py --out qa-out/ios-sim
      - name: WDA onbellegini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/wda-derived
          key: wda-${{ runner.os }}-${{ runner.arch }}-${{ steps.ver.outputs.k }}-${{ github.run_id }}
      - name: Yedek - simctl openurl + ekran goruntusu (yalniz Appium kurulamadiysa)
        if: ${{ steps.appium.outcome == 'failure' }}
        run: |
          echo "[ALTYAPI] Appium yolu basarisiz, yedek simctl denetimi calisiyor"
          python qa/ios/run_sim.py --out qa-out/ios-sim-yedek
      - name: Rapor (artifact'siz, log'a tam metin)
        if: always()
        run: python qa/report/make_report.py --in qa-out --out qa-rapor-job --title "ios-simulator" > /dev/null; cat qa-rapor-job/mobil-uyumluluk-raporu.md 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-ios-sim, path: qa-out/, retention-days: 14 }

  rapor:
    needs: [simulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: qa-ios-*, path: qa-in }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rapor (GEÇTİ/KALDI tablosu job özetine yazılır)
        run: |
          python qa/report/make_report.py --in qa-in --out qa-rapor --title "iOS QA raporu" > /dev/null
          cat qa-rapor/mobil-uyumluluk-raporu.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-ios-rapor
          path: |
            qa-rapor/
            qa-in/
          retention-days: 14
      - name: Kapı
        run: python qa/report/make_report.py --in qa-in --out qa-rapor --gate --summary /dev/null > /dev/null
