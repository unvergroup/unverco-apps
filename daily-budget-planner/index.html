<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a21">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daily Budget">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="license" content="Icons: Lucide, ISC License, Copyright (c) 2026 Lucide Icons and Contributors; Feather-derived icons MIT, Copyright (c) 2013-present Cole Bemis. Full texts: LICENSES.txt.">
  <title>ÜNVERCO Daily Budget Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <img id="logo-gold" src="icons/unverco-logo-altin.png" alt="" hidden>
  <img id="logo-blue" src="icons/unverco-logo-mavi.png" alt="" hidden>
  <img id="appicon-src" src="icons/app-icon-96.png" alt="" hidden>
  <div class="app">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main" id="main" tabindex="-1">
      <div class="topbar" id="topbar"></div>
      <div id="banners"></div>
      <div id="screen"></div>
    </main>
    <nav class="bottomnav glass" id="bottomnav"></nav>
  </div>
  <div id="print-root" aria-hidden="true"></div>
  <div id="toast-region" aria-live="polite"></div>
  <noscript><p>This app needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
